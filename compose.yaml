services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - luwi-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  luwi-redis-data:
